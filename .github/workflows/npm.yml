name: Publish npm shim

# Publishes npm/uplink-chat (binary shim) on every version tag, after the
# GoReleaser workflow has attached that tag's assets. Requires a
# repository secret NPM_TOKEN (npm access token with publish rights on
# the uplink-chat package). The shim's version must equal the tag.
on:
  push:
    tags:
      - 'v*'

jobs:
  npm-publish:
    name: npm publish uplink-chat
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm/uplink-chat
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG != package version $PKG — bump npm/uplink-chat/package.json first"
            exit 1
          fi
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
