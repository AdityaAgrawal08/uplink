name: Release

# SUPPLY-CHAIN NOTE: every `uses:` reference below is pinned to a full
# commit SHA (with a `# vN` comment naming the tag it corresponds to), so a
# compromised or retagged action version can never be pulled into releases.
# Dependabot keeps these SHAs current: it opens a PR bumping the SHA (and
# the comment) whenever a new action version ships — approve and merge as
# routine maintenance.

# Single source of truth for release artifacts is .goreleaser.yaml: it
# emits the exact asset names install.sh / install.ps1 expect
# (uplink-<os>-<arch>.tar.gz, .zip on Windows), plus the checksums.txt
# both installers and `uplink update` verify before installing. The old
# hand-rolled matrix is gone: it published tarballs for Windows (the
# installer expects .zip) and no checksums at all (installers refuse).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — SHA-pinned (dependabot updates)
        with:
          fetch-depth: 0

      - name: Set Up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6 — SHA-pinned (dependabot updates)
        with:
          go-version-file: cli/go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6 — SHA-pinned (dependabot updates)
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
